name: Build TWRP for KC-01/KYL23

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'device/**'
      - 'kernel/**'
      - '.github/workflows/twrp.yml'

jobs:
  twrp:
    runs-on: ubuntu-latest
    timeout-minutes: 720

    steps:
      - name: Cleanup runner workspace
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Maximize disk space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          temp-reserve-mb: 128
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Install dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            git ccache automake lzop bison gperf build-essential zip curl \
            zlib1g-dev zlib1g-dev:i386 g++-multilib gcc-multilib \
            lib32z1 lib32stdc++6 \
            python3-networkx libxml2-utils bzip2 libbz2-dev \
            squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool make \
            optipng libssl-dev pwgen libswitch-perl policycoreutils \
            libxml-simple-perl bc imagemagick binutils wget cpio \
            python3-pip
          # Packages that may be absent on noble - don't fail the build
          sudo apt-get install -y libghc-bzlib-dev maven || true

      - name: Install repo tool
        run: |
          sudo curl -L https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
          sudo chmod a+x /usr/local/bin/repo
          git config --global user.name "Builder"
          git config --global user.email "builder@example.com"

      - name: Sync TWRP source (minimal omni 7.1)
        run: |
          # NOTE: build volume (LVM) is mounted at $GITHUB_WORKSPACE by
          # maximize-build-space; root fs is full, so everything goes here.
          echo "Workspace: ${GITHUB_WORKSPACE}"
          df -h "${GITHUB_WORKSPACE}"
          mkdir -p "${GITHUB_WORKSPACE}/rom"
          cd "${GITHUB_WORKSPACE}/rom"
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b twrp-7.1
          repo sync -c --no-clone-bundle --no-tags --no-repo-verify -j8

      - name: Checkout local trees
        uses: actions/checkout@v4
        with:
          path: local

      - name: Apply local trees
        run: |
          rm -rf "${GITHUB_WORKSPACE}/rom/device/kyocera/kc01" "${GITHUB_WORKSPACE}/rom/kernel/kyocera/kc01"
          mkdir -p "${GITHUB_WORKSPACE}/rom/device/kyocera" "${GITHUB_WORKSPACE}/rom/kernel/kyocera"
          cp -r "${GITHUB_WORKSPACE}/local/device/kyocera/kc01" "${GITHUB_WORKSPACE}/rom/device/kyocera/kc01"
          cp -r "${GITHUB_WORKSPACE}/local/kernel/kyocera/kc01" "${GITHUB_WORKSPACE}/rom/kernel/kyocera/kc01"
          ls -la "${GITHUB_WORKSPACE}/rom/kernel/kyocera/kc01/Makefile"

      - name: Build TWRP
        working-directory: ${{ github.workspace }}/rom
        run: |
          export ALLOW_MISSING_DEPENDENCIES=true
          export TW_DEVICE_VERSION=1
          source build/envsetup.sh
          lunch omni_kc01-eng
          mka adbd recoveryimage -j$(nproc --all)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: twrp-kc01
          path: ${{ github.workspace }}/rom/out/target/product/kc01/recovery.img
          if-no-files-found: error
