name: Build TWRP for KC-01/KYL23

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'device/**'
      - 'kernel-overlay/**'
      - '.github/workflows/twrp.yml'

jobs:
  twrp:
    # 22.04: last runner with python2 available (Android 7.1 build system is py2)
    runs-on: ubuntu-22.04
    timeout-minutes: 720

    steps:
      - name: Checkout local trees (early, before workspace gets dirty)
        uses: actions/checkout@v4
        with:
          path: local

      - name: Cleanup runner workspace
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git ccache automake lzop bison gperf build-essential zip curl \
            zlib1g-dev g++-multilib gcc-multilib \
            python3-networkx libxml2-utils bzip2 libbz2-dev \
            squashfs-tools pngcrush schedtool dpkg-dev liblz4-tool make \
            optipng libssl-dev pwgen libswitch-perl policycoreutils \
            libxml-simple-perl bc imagemagick binutils wget cpio \
            python3-pip
          # Python 2 for the Android 7.1 build system (install separately:
          # python-is-python2 doesn't exist on jammy and aborts the batch)
          sudo apt-get install -y python2
          sudo apt-get install -y python-is-python2 || true
          # Make plain 'python' resolve to python2 for the build session
          sudo ln -sf /usr/bin/python2 /usr/local/bin/python
          sudo ln -sf /usr/bin/python2 /usr/local/bin/python2.7 2>/dev/null || true
          python --version
          python2 --version
          # Older toolchain for Nougat-era kernel build compatibility
          sudo apt-get install -y gcc-9 g++-9 || true
          # Android 7.1 needs JDK 8 (tools.jar); runner defaults to JDK 11
          sudo apt-get install -y openjdk-8-jdk
          echo "JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64" >> "$GITHUB_ENV"
          # Old prebuilt clang needs ncurses5/tinfo5 (jammy ships 6)
          sudo apt-get install -y libncurses5 libtinfo5 || true
          # Packages that may be absent - don't fail the build
          sudo apt-get install -y libghc-bzlib-dev maven || true

      - name: Install repo tool
        run: |
          sudo curl -L https://storage.googleapis.com/git-repo-downloads/repo -o /usr/local/bin/repo
          sudo chmod a+x /usr/local/bin/repo
          git config --global user.name "Builder"
          git config --global user.email "builder@example.com"

      - name: Sync TWRP source (minimal omni 7.1)
        run: |
          # Build in ~/rom, keep workspace clean for the checkout copy.
          export ROM=~/rom
          mkdir -p ${ROM}
          df -h ~
          cd ${ROM}
          repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b twrp-7.1
          repo sync -c --no-clone-bundle --no-tags --no-repo-verify -j8

      - name: Apply local trees
        run: |
          export ROM=~/rom
          rm -rf ${ROM}/device/kyocera/kc01 ${ROM}/kernel/kyocera/kc01
          mkdir -p ${ROM}/device/kyocera
          cp -r "${GITHUB_WORKSPACE}/local/device/kyocera/kc01" ${ROM}/device/kyocera/kc01
          # Kernel: clone the clean thea (LineageOS msm8226) source on the
          # case-sensitive Linux FS, then graft our Kyocera overlay on top.
          # (The full tree can't be shipped in-repo: it was unpacked on
          # Windows and case-collision files like xt_MARK.h were lost.)
          git clone --depth 1 -b cm-14.1 https://github.com/LineageOS/android_kernel_motorola_msm8226.git ${ROM}/kernel/kyocera/kc01
          cp -r "${GITHUB_WORKSPACE}/local/kernel-overlay/." ${ROM}/kernel/kyocera/kc01/
          ls ${ROM}/kernel/kyocera/kc01/arch/arm/configs/kc01_defconfig
          # dtbToolCM is not in the minimal TWRP manifest; ship our own
          # prebuilt (from CyanogenMod device/qcom/common dtbtool) and put
          # it where the build system expects it.
          mkdir -p ${ROM}/out/host/linux-x86/bin
          cp "${GITHUB_WORKSPACE}/local/tools/dtbToolCM" ${ROM}/out/host/linux-x86/bin/dtbToolCM
          chmod +x ${ROM}/out/host/linux-x86/bin/dtbToolCM

      - name: Build TWRP
        working-directory: /home/runner/rom
        run: |
          export ALLOW_MISSING_DEPENDENCIES=true
          export TW_DEVICE_VERSION=1
          # Belt & suspenders: put the kernel toolchains on PATH so any
          # CROSS_COMPILE prefix resolves even if kernel.mk vars miss
          export PATH=$PATH:${PWD}/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/bin
          export PATH=$PATH:${PWD}/prebuilts/gcc/linux-x86/arm/arm-eabi-4.8/bin
          # Old host gcc for the 3.4 kernel's host tools (dtc etc.)
          export HOSTCC=gcc-9
          source build/envsetup.sh
          lunch omni_kc01-eng
          mka adbd recoveryimage -j$(nproc --all)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: twrp-kc01
          path: /home/runner/rom/out/target/product/kc01/recovery.img
          if-no-files-found: error
